server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # --- Compression ---------------------------------------------------------
    # Uniquement le texte : PAS les images/vidéos (déjà compressées, et gzip
    # casserait le streaming/Range des mp4).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/javascript
        application/javascript
        image/svg+xml
        application/json;

    # --- Headers de sécurité (émis sur toutes les réponses) ------------------
    # frame-ancestors est la SEULE directive CSP portée par nginx : le reste de
    # la CSP (avec hashes script/style) est émis par Astro en <meta>.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Assets fingerprintés Astro : cache immutable ------------------------
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Les add_header d'un bloc parent ne sont PAS hérités dès qu'un
        # add_header apparaît ici : on les redéclare pour ne pas les perdre.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # --- Pages HTML et autres fichiers ---------------------------------------
    # try_files sert les fichiers statiques tels quels ; les vidéos mp4/webm
    # bénéficient du support natif des Range requests de nginx (seek + lecture
    # partielle) — rien ici ne le désactive.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ =404;
    }

    # --- Page 404 personnalisée générée par Astro ----------------------------
    error_page 404 /404.html;
}
